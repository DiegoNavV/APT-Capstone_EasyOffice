name: Firma API

on:
  push:
    branches: [main]
    paths:
      - "Código/easyoffice-firma-api/**"
      - ".github/workflows/firma-api.yml"
  pull_request:
    branches: [main]
    paths:
      - "Código/easyoffice-firma-api/**"
      - ".github/workflows/firma-api.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Código/easyoffice-firma-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Código/easyoffice-firma-api/requirements.txt

      - run: pip install -r requirements.txt

      - run: pytest -v
