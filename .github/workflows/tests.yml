name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Pruebas backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Código/easyoffice-backend
    # Los tests corren contra un Postgres real (ver tests/conftest.py): recrean su propia
    # base crm_easyoffice_test en este servicio con los mismos archivos de db/init/ que usa
    # Docker en desarrollo, para probar los CHECK/triggers/funciones reales del esquema.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: easyoffice
          POSTGRES_PASSWORD: easyoffice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U easyoffice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_HOST: localhost
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Código/easyoffice-backend/requirements.txt

      - name: Instalación de requerimientos
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest -v

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Código/easyoffice-frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Código/easyoffice-frontend/package-lock.json

      - name: Instalación de dependencias
        run: npm ci

      - name: Compilar el proyecto
        run: npm run build
