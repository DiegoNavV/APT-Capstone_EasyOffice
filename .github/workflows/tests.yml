name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Pruebas backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Código/easyoffice-backend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Código/easyoffice-backend/requirements.txt

      - name: Instalación de requerimientos
        run: pip install -r requirements.txt

      - name: Ejecutar tests
        run: pytest -v

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Código/easyoffice-frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Código/easyoffice-frontend/package-lock.json

      - name: Instalación de dependencias
        run: npm ci

      - name: Compilar el proyecto
        run: npm run build
