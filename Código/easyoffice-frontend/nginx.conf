server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA con react-router: cualquier ruta que no sea un archivo real
    # (ej. /panel) cae a index.html, para que funcione incluso con recarga
    # directa del navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desactivado: no estamos usando ngrok para exponer la app. Si en algún
    # momento se necesita un solo túnel para frontend+backend, descomentar
    # este bloque (y el VITE_API_URL: "" en docker-compose.yml) deja la API
    # en el mismo origen que el frontend, para que la cookie httpOnly del
    # refresh token (samesite=lax) viaje sin problemas de cross-site y no
    # haga falta tocar CORS. "backend" es el nombre del servicio en
    # docker-compose.yml, resuelto por el DNS interno de Docker.
    # location /api/ {
    #     proxy_pass http://backend:8000/api/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
