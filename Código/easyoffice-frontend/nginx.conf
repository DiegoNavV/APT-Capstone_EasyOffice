server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA con react-router: cualquier ruta que no sea un archivo real
    # (ej. /panel) cae a index.html, para que funcione incluso con recarga
    # directa del navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
