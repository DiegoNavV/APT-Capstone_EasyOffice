services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: easyoffice
      POSTGRES_PASSWORD: easyoffice
      POSTGRES_DB: crm_easyoffice
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyoffice -d crm_easyoffice"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://easyoffice:easyoffice@db:5432/crm_easyoffice
      # Firma de los access tokens del login. Definir uno propio en un archivo
      # .env junto a este compose (ver .env.example); el valor por defecto es
      # solo para desarrollo.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cambiar-esto-en-cada-entorno}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./scripts:/app/scripts
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # easyoffice-frontend no tiene docker-compose propio: el login del panel
    # y la API viven juntos en este archivo, asi que el frontend se agrega
    # aca con un build context relativo en vez de duplicar el compose.
    build:
      context: ../easyoffice-frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data: