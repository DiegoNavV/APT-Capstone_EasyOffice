services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: easyoffice
      POSTGRES_PASSWORD: easyoffice
      POSTGRES_DB: crm_easyoffice
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyoffice -d crm_easyoffice"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://easyoffice:easyoffice@db:5432/crm_easyoffice
      # Firma de los access tokens del login. Definir uno propio en un archivo
      # .env junto a este compose (ver .env.example); el valor por defecto es
      # solo para desarrollo.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cambiar-esto-en-cada-entorno}
      # Carpeta (volumen de Docker, fuera de Git) donde se guardan las plantillas Word.
      PLANTILLAS_DIR: /app/plantillas
      # Quién puede gestionar plantillas. Por defecto solo "administrador".
      # Para sumar a los agentes: ROLES_GESTORES_PLANTILLAS="administrador,agente" en el .env.
      ROLES_GESTORES_PLANTILLAS: ${ROLES_GESTORES_PLANTILLAS:-administrador}
      # Carpeta (volumen de Docker, fuera de Git) donde se guardan los PDF generados.
      DOCUMENTOS_DIR: /app/documentos
      # Marca con la que se emiten los documentos (EASY OFFICE o INOFFICE).
      MARCA_POR_DEFECTO: ${MARCA_POR_DEFECTO:-EASY OFFICE}
      # Datos de pago que se escriben en el contrato, uno por marca. Van SOLO en
      # el .env (que no se sube a Git), nunca aqui. Sin ellos no se genera el documento.
      BANCO_TEXTO_EASY_OFFICE: ${BANCO_TEXTO_EASY_OFFICE:-}
      BANCO_TEXTO_INOFFICE: ${BANCO_TEXTO_INOFFICE:-}
      # Conexion con la API de firma (contrato: easyoffice-firma-api/CONTRATO_INTEGRACION.md).
      # Los valores por defecto sirven solo para desarrollo y coinciden con los de su compose.
      FIRMA_API_URL: ${FIRMA_API_URL:-http://firma-api:8000/api/v1}
      FIRMA_API_KEY: ${FIRMA_API_KEY:-fk_test_dev-inseguro-cambiar}
      FIRMA_WEBHOOK_SECRET: ${FIRMA_WEBHOOK_SECRET:-dev-inseguro-cambiar}
      # Direccion a la que la API de firma avisa cuando un documento se firma, se rechaza o vence.
      FIRMA_CALLBACK_URL: ${FIRMA_CALLBACK_URL:-http://backend:8000/api/webhooks/firma}
    # La red easyoffice-net es la que comparte con la API de firma (ver el final del archivo).
    networks:
      - default
      - easyoffice-net
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      # Los tests lo necesitan para levantar la base de pruebas con el esquema real
      # (db/init/), no una reconstrucción aparte (ver tests/conftest.py).
      - ./db:/app/db
      - plantillas_data:/app/plantillas
      - documentos_data:/app/documentos
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # easyoffice-frontend no tiene docker-compose propio: el login del panel
    # y la API viven juntos en este archivo, asi que el frontend se agrega
    # aca con un build context relativo en vez de duplicar el compose.
    build:
      context: ../easyoffice-frontend
      args:
        VITE_API_URL: http://localhost:8000
        # Alternativa para exponer todo detrás de un solo túnel ngrok sin
        # romper la cookie httpOnly del refresh token (samesite=lax no viaja
        # cross-site): usar VITE_API_URL: "" (vacío = mismo origen que el
        # frontend) y descomentar el bloque location /api/ en nginx.conf.
        # VITE_API_URL: ""
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
  plantillas_data:
  documentos_data:

networks:
  default: {}
  # Red compartida con la API de firma. Es externa en ambos compose, asi que
  # ninguno depende del orden de arranque del otro. Se crea UNA sola vez con:
  #   docker network create easyoffice-net
  easyoffice-net:
    external: true